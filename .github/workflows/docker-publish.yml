name: Docker Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish image publication and its Git tag together; do not cancel between them.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  eligible:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      github.event.workflow_run.head_commit.author.username != 'dependabot[bot]' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release changes
        id: changes
        shell: bash
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$MANUAL" == 'true' ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Keep the author guard when a human actor starts CI for a bot-authored commit.
          # workflow_run does not consistently include author.username; inspect Git metadata.
          author_email=$(git show -s --format='%ae' HEAD)
          if [[ "$author_email" == '49699333+dependabot[bot]@users.noreply.github.com' ||
                "$author_email" == 'dependabot[bot]@users.noreply.github.com' ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A slow older CI run must not overwrite latest after main advances.
          current=$(git rev-parse refs/remotes/origin/main)
          if [[ "$sha" != "$current" ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare with the previous release, covering multi-commit pushes too.
          previous=$(git describe --tags --match 'v[0-9][0-9].[0-9][0-9].[0-9][0-9]*' --abbrev=0 2>/dev/null || true)
          if [[ -z "$previous" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "$previous" HEAD -- '*.go' go.mod go.sum web Dockerfile .dockerignore ':(exclude)*_test.go')
            if [[ -n "$changed" ]]; then
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            else
              echo 'publish=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  docker:
    needs: eligible
    if: needs.eligible.outputs.publish == 'true'
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.eligible.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Set up Go for manual release validation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: bash .github/scripts/check.sh

      - name: Set image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_tag="v$(date -u +'%y.%m.%d')"
          tag="$base_tag"
          count=0
          git fetch --tags --force
          while git show-ref --verify --quiet "refs/tags/$tag"; do
            count=$((count + 1))
            tag="${base_tag}-${count}"
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=submanager
          cache-to: type=gha,scope=submanager,mode=max
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Submanager
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.eligible.outputs.sha }}

      - name: Create git tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

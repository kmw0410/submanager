<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090B">
  <title>{{if eq .Mode "setup"}}관리자 계정 설정{{else}}로그인{{end}} — SubManager</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-brand"><svg class="brand-wallet" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7.5h14.5A1.5 1.5 0 0 1 20 9v9a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V6a2 2 0 0 1 2-2h13"/><path d="M2.5 7.5V6A2 2 0 0 1 4.5 4H17a1 1 0 0 1 1 1v2.5"/><path d="M16 12h4v4h-4a2 2 0 0 1 0-4Z"/><circle cx="16" cy="14" r=".5"/></svg><span>SubManager</span></div>
    <section class="auth-card">
      {{if eq .Mode "setup"}}
      <span class="step-label">최초 1회 설정</span>
      <h1>관리자 계정을 만들어요</h1>
      <p>이 계정으로 구독 정보와 설정을 안전하게 관리할 수 있어요.</p>
      {{else}}
      <span class="step-label">다시 오셨네요</span>
      <h1>로그인</h1>
      <p>관리자 계정으로 SubManager를 열어보세요.</p>
      {{end}}
      <form id="authForm" data-mode="{{.Mode}}">
        {{if eq .Mode "setup"}}<label class="field"><span>이름</span><input name="name" required maxlength="50" autocomplete="name" placeholder="이름을 입력해 주세요"></label>{{end}}
        <label class="field"><span>이메일</span><input name="email" required type="email" maxlength="254" autocomplete="email" placeholder="name@example.com"></label>
        <label class="field"><span>비밀번호</span><input name="password" required type="password" minlength="8" maxlength="72" autocomplete="{{if eq .Mode "setup"}}new-password{{else}}current-password{{end}}" placeholder="8자 이상 입력해 주세요"></label>
        <div class="form-error" id="authError"></div>
        <button class="button primary auth-submit" type="submit">{{if eq .Mode "setup"}}관리자 계정 만들기{{else}}로그인{{end}}</button>
      </form>
      {{if eq .Mode "setup"}}<p class="auth-note">최초 관리자 생성 후에는 추가 계정을 만들 수 없어요.</p>{{end}}
    </section>
  </main>
  <script>
  (()=>{const form=document.querySelector('#authForm'),error=document.querySelector('#authError');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const button=form.querySelector('button');button.disabled=true;const data=new FormData(form),mode=form.dataset.mode;const body={email:data.get('email'),password:data.get('password')};if(mode==='setup')body.name=data.get('name');try{const res=await fetch(mode==='setup'?'/auth/setup':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});const json=await res.json();if(!res.ok)throw new Error(json.error||'요청을 처리하지 못했어요.');location.replace('/')}catch(err){error.textContent=err.message;button.disabled=false}})})();
  </script>
</body>
</html>

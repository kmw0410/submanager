services:
  submanager:
    image: ghcr.io/kmw0410/submanager:latest
    container_name: submanager
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/submanager.db
      TZ: ${TZ:-Asia/Seoul}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    volumes:
      - submanager-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  submanager-data:

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#09090B">
  <title>SubManager</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" type="button" data-view="dashboard" aria-label="대시보드로 이동"><svg class="brand-wallet" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7.5h14.5A1.5 1.5 0 0 1 20 9v9a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V6a2 2 0 0 1 2-2h13"/><path d="M2.5 7.5V6A2 2 0 0 1 4.5 4H17a1 1 0 0 1 1 1v2.5"/><path d="M16 12h4v4h-4a2 2 0 0 1 0-4Z"/><circle cx="16" cy="14" r=".5"/></svg><span>SubManager</span></button>
    <div class="header-actions">
      <button class="icon-button" id="settingsButton" type="button" aria-label="설정 열기" title="설정">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.25A3.25 3.25 0 1 0 12 8.75a3.25 3.25 0 0 0 0 6.5Z"/><path d="M19.4 13.5a7.8 7.8 0 0 0 .05-3l1.35-1.05-1.8-3.1-1.67.68a8 8 0 0 0-2.6-1.5L14.5 3.75h-3.6l-.25 1.78a8 8 0 0 0-2.58 1.5L6.4 6.35l-1.8 3.1 1.35 1.05a7.8 7.8 0 0 0 .05 3l-1.4 1.05 1.8 3.1 1.68-.68a8 8 0 0 0 2.57 1.5l.25 1.78h3.6l.25-1.78a8 8 0 0 0 2.58-1.5l1.67.68 1.8-3.1-1.4-1.05Z"/></svg>
      </button>
      <button class="button primary small" id="addSubscriptionButton" type="button"><span>+</span> 구독 추가</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="구독 요약">
      <section class="summary-card split-card">
        <button type="button" data-view="subscriptions"><span class="eyebrow">구독</span><strong id="activeCount">0개</strong></button>
        <button type="button" data-view="upcoming"><span class="eyebrow">결제 예정</span><strong id="upcomingCount">0건</strong></button>
      </section>
      <button class="summary-card metric-card" type="button" data-view="dashboard">
        <span class="eyebrow">이번 달</span><strong id="monthTotal">₩0</strong>
      </button>
      <button class="summary-card metric-card" type="button" data-view="dashboard">
        <span class="eyebrow">1년 예상</span><strong id="yearTotal">₩0</strong>
      </button>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><div><span class="step-label" id="modalKicker"></span><h2 id="modalTitle"></h2></div><button class="close-button" type="button" data-close-modal aria-label="닫기">×</button></div>
      <div id="modalBody"></div>
    </section>
  </div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <script>window.__INITIAL_STATE__ = {{.InitialState}};</script>
  <script src="/assets/app.js" defer></script>
</body>
</html>
